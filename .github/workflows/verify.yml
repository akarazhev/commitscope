name: Verify review project
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Unit/protocol (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit, protocol and real application behavior tests
        run: python -I tests/run_tests.py
  package-install:
    needs: unit
    name: Package install (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source-mode smoke test
        run: |
          python -I review.py --version
          python -I review.py --help
          python -I review.py preflight
      - name: Deterministic wheel and source distribution
        env:
          SOURCE_DATE_EPOCH: '1790035200'
        run: |
          python -I scripts/build_dist.py --dist-dir dist-a
          python -I scripts/build_dist.py --dist-dir dist-b
          cmp dist-a/commitscope-2.4.0-py3-none-any.whl dist-b/commitscope-2.4.0-py3-none-any.whl
          cmp dist-a/commitscope-2.4.0.tar.gz dist-b/commitscope-2.4.0.tar.gz
          mv dist-a dist
      - name: Inspect distribution archive contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path('dist')
          wheels = sorted(dist.glob('*.whl'))
          sdists = sorted(dist.glob('*.tar.gz'))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f'Expected one wheel and one sdist, found {wheels} and {sdists}')

          blocked_dirs = {'.tools', '.runs', '.idea', '.git', '.worktrees'}
          allowed_credentials = (
              'examples/vulnerable/credentials.txt',
              'share/commitscope/examples/vulnerable/credentials.txt',
          )

          def archive_entries(archive):
              if archive.suffix == '.whl':
                  with zipfile.ZipFile(archive) as opened:
                      return sorted(opened.namelist())
              with tarfile.open(archive, 'r:gz') as opened:
                  return sorted(member.name for member in opened.getmembers())

          def rejection_reason(name):
              normalized = name.replace('\\', '/').strip('/')
              parts = normalized.split('/')
              if any(part in blocked_dirs for part in parts):
                  return 'state, IDE, or VCS directory'
              if normalized.startswith('/') or '..' in parts:
                  return 'unsafe archive path'
              if 'raw' in parts or parts[-1].endswith('.raw.json'):
                  return 'raw report'
              if parts[-1] in ('report.json', 'report.md', 'report.sarif'):
                  return 'generated report'
              if 'credentials' in parts[-1].lower() and not any(normalized.endswith(path) for path in allowed_credentials):
                  return 'credential-like file'
              return ''

          rejected = []
          for archive in (*wheels, *sdists):
              print(f'{archive}:')
              for entry in archive_entries(archive):
                  print(entry)
                  reason = rejection_reason(entry)
                  if reason:
                      rejected.append((archive.as_posix(), entry, reason))

          if rejected:
              for archive, entry, reason in rejected:
                  print(f'Rejected {archive}: {entry} ({reason})')
              raise SystemExit('Distribution archive contains forbidden entries')
          PY
      - name: Install wheel into clean venv and smoke test CLI
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path
          wheels = sorted(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'Expected one wheel, found {wheels}')
          print(wheels[0].resolve())
          PY
          )"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --no-index --no-deps "$wheel"
          cd "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          commitscope --version
          commitscope preflight
          commitscope demo --app-only --out "$RUNNER_TEMP/package-demo"
          python -m sec_review --version
      - name: Install sdist into clean venv and smoke test CLI
        run: |
          sdist="$(python - <<'PY'
          from pathlib import Path
          sdists = sorted(Path('dist').glob('*.tar.gz'))
          if len(sdists) != 1:
              raise SystemExit(f'Expected one sdist, found {sdists}')
          print(sdists[0].resolve())
          PY
          )"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --no-index --no-deps "$sdist"
          cd "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/sdist-venv/bin:$PATH"
          commitscope --version
          commitscope preflight
          python -m sec_review --version
      - name: Exact-commit Git install (pipx-equivalent pre-tag check)
        run: |
          commit="$(git rev-parse HEAD)"
          python -m venv "$RUNNER_TEMP/exact-commit-venv"
          "$RUNNER_TEMP/exact-commit-venv/bin/python" -m pip install --no-deps --no-build-isolation "git+file://$GITHUB_WORKSPACE@$commit"
          cd "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/exact-commit-venv/bin:$PATH"
          commitscope --version
          commitscope preflight
  consumer-action:
    needs: unit
    name: Consumer action (ubuntu-24.04, Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Create fixed fixture subject repository
        id: subject
        run: |
          subject="$RUNNER_TEMP/subject"
          mkdir -p "$subject"
          cp -R examples/fixed/. "$subject/"
          git -C "$subject" init
          git -C "$subject" config user.name "CommitScope CI"
          git -C "$subject" config user.email "commitscope-ci@example.invalid"
          git -C "$subject" add .
          git -C "$subject" commit -m "Add fixed fixture"
          sha="$(git -C "$subject" rev-parse HEAD)"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - id: commitscope
        uses: ./
        with:
          repo: ${{ runner.temp }}/subject
          ref: ${{ steps.subject.outputs.sha }}
          fail-on: high
          allow-empty-sca: The fixed acceptance fixture uses only the Python standard library.
      - name: Verify consumer action reports
        env:
          REPORT_JSON: ${{ steps.commitscope.outputs.report-json }}
          REPORT_MARKDOWN: ${{ steps.commitscope.outputs.report-markdown }}
          REPORT_SARIF: ${{ steps.commitscope.outputs.report-sarif }}
        run: |
          test -f "$REPORT_JSON"
          test -f "$REPORT_MARKDOWN"
          test -f "$REPORT_SARIF"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ['REPORT_JSON']).read_text())
          if report.get('decision', {}).get('exit_code') != 0:
              raise SystemExit(f'Expected decision exit code 0, got {report.get("decision")}')

          scanners = report.get('scanners')
          if not isinstance(scanners, list) or not scanners:
              raise SystemExit('Report has no scanner results')
          bad = [
              scanner for scanner in scanners
              if scanner.get('status') not in ('complete', 'not_applicable')
              or (scanner.get('status') == 'not_applicable' and not scanner.get('reason'))
          ]
          if bad:
              raise SystemExit(f'Incomplete scanner results: {bad}')
          PY
      - name: Preserve consumer action reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-action-security-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ steps.commitscope.outputs.report-json }}
            ${{ steps.commitscope.outputs.report-markdown }}
            ${{ steps.commitscope.outputs.report-sarif }}
  live-scanners:
    needs: unit
    name: Live scanners (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.14'
            artifact-suffix: ubuntu24-x64-py314
          - os: ubuntu-24.04-arm
            python-version: '3.14'
            artifact-suffix: ubuntu24-arm64-py314
          - os: macos-15
            python-version: '3.14'
            artifact-suffix: macos15-arm64-py314
          - os: macos-15-intel
            python-version: '3.14'
            artifact-suffix: macos15-x64-py314
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install actual pinned scanner releases
        env:
          PYTHON: python
        run: sh scripts/bootstrap.sh
      - name: Verify installed versions
        run: python -I review.py doctor
      - name: Real vulnerable-to-fixed scanner acceptance
        run: python -I review.py demo --out reports/demo
      - name: Preserve normalized evidence, including failed runs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-security-evidence-${{ matrix.artifact-suffix }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            reports/demo/demo-result.json
            reports/demo/application-tests.txt
            reports/demo/comparison.json
            reports/demo/vulnerable-review/report.json
            reports/demo/vulnerable-review/report.md
            reports/demo/vulnerable-review/report.sarif
            reports/demo/fixed-review/report.json
            reports/demo/fixed-review/report.md
            reports/demo/fixed-review/report.sarif
