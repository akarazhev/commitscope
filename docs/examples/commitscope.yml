name: CommitScope

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: CommitScope scanner evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Check out target commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Run CommitScope
        id: commitscope
        uses: akarazhev/commitscope@v2.3.0
        with:
          repo: ${{ github.workspace }}
          ref: ${{ github.sha }}
          fail-on: high

      - name: Preserve CommitScope reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commitscope-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ steps.commitscope.outputs.report-json }}
            ${{ steps.commitscope.outputs.report-markdown }}
            ${{ steps.commitscope.outputs.report-sarif }}

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: ${{ steps.commitscope.outputs.report-sarif }}
