[build-system]
requires = []
build-backend = "sec_review_build"
backend-path = ["."]

[project]
name = "commitscope"
dynamic = ["version"]
description = "Evidence-driven security review for Git repositories"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []
license = "MIT"
authors = [{name = "Andrey Karazhev"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/akarazhev/commitscope"
Repository = "https://github.com/akarazhev/commitscope"
Issues = "https://github.com/akarazhev/commitscope/issues"

[project.scripts]
commitscope = "sec_review.cli:main"

[tool.commitscope-build]
packages = ["sec_review"]

[tool.commitscope-build.dynamic]
version = {attr = "sec_review.__version__"}

[tool.commitscope-build.data-files]
"share/commitscope/config" = [
  "config/claude-settings.json",
  "config/claude.version",
  "config/empty-mcp.json",
  "config/gitleaks.toml",
  "config/hunter.schema.json",
  "config/project-context.md",
  "config/resource-manifest.json",
  "config/sdist-manifest.json",
  "config/semgrep.yaml",
  "config/tools.lock.json",
  "config/trivy.yaml",
  "config/verifier.schema.json",
]
"share/commitscope/prompts" = [
  "prompts/hunter.md",
  "prompts/verifier.md",
]
"share/commitscope/examples/fixed" = [
  "examples/fixed/Dockerfile",
  "examples/fixed/app.py",
  "examples/fixed/requirements.txt",
]
"share/commitscope/examples/vulnerable" = [
  "examples/vulnerable/Dockerfile",
  "examples/vulnerable/app.py",
  "examples/vulnerable/credentials.txt",
  "examples/vulnerable/requirements.txt",
]
"share/commitscope/tests" = [
  "tests/test_demo_app.py",
]
